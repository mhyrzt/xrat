name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/set-version.py --check
      - run: python3 -m unittest discover -s scripts/tests -q
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -q --locked --workspace
      - name: Verify SDK public features and standalone consumer
        run: python3 scripts/check-sdk.py

  macos-check:
    name: Check macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-check-${{ matrix.target }}
      - run: cargo check --locked --workspace --target ${{ matrix.target }}

  sdk-native:
    name: SDK native engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned validators
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-engines/xray"
          curl -fL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o "$RUNNER_TEMP/sdk-engines/xray.zip"
          unzip -q "$RUNNER_TEMP/sdk-engines/xray.zip" -d "$RUNNER_TEMP/sdk-engines/xray"
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.13.21/sing-box-1.13.21-linux-amd64.tar.gz -o "$RUNNER_TEMP/sdk-engines/sing-box.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdk-engines/sing-box.tar.gz" -C "$RUNNER_TEMP/sdk-engines"
          echo "XRAT_SDK_XRAY_BINARY=$RUNNER_TEMP/sdk-engines/xray/xray" >> "$GITHUB_ENV"
          echo "XRAT_SDK_SINGBOX_BINARY=$RUNNER_TEMP/sdk-engines/sing-box-1.13.21-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - name: Validate SDK JSON and probe cleanup
        run: cargo test --locked -p xrat-sdk --test native -- --ignored
