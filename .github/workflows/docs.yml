name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.3
      MDBOOK_MERMAID_VERSION: 0.17.0
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache mdBook tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}
      - name: Install mdBook
        run: |
          installed_version() {
            "$1" --version | awk '{print $2}' | sed 's/^v//'
          }

          if ! command -v mdbook >/dev/null || [ "$(installed_version mdbook)" != "${MDBOOK_VERSION}" ]; then
            cargo install --version ${MDBOOK_VERSION} mdbook --locked
          fi
          if ! command -v mdbook-mermaid >/dev/null || [ "$(installed_version mdbook-mermaid)" != "${MDBOOK_MERMAID_VERSION}" ]; then
            cargo install --version ${MDBOOK_MERMAID_VERSION} mdbook-mermaid --locked
          fi
      - name: Install mermaid assets
        run: mdbook-mermaid install .
      - name: Restore custom mermaid theme
        run: git checkout mermaid.css mermaid-init.js
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    name: Deploy
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
