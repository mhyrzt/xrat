repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt (check)
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types_or: [rust]

      - id: rust-max-line-length
        name: rust max line length (150)
        language: system
        files: \.rs$
        entry: bash -c '
          failed=0
          for file in "$@"; do
            [ -f "$file" ] || continue
            if awk "length(\$0) > 150 { print FNR \":\" \$0; found=1 } END { exit found ? 0 : 1 }" "$file" > /tmp/precommit_rust_long_lines.$$; then
              echo "Lines longer than 150 chars in $file:"
              cat /tmp/precommit_rust_long_lines.$$
              failed=1
            fi
          done
          rm -f /tmp/precommit_rust_long_lines.$$
          [ "$failed" -eq 0 ]
        ' --

      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust]

      - id: cargo-test
        name: cargo test
        entry: cargo test -q
        language: system
        pass_filenames: false
        stages: [pre-push]
