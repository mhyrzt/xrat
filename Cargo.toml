[package]
name = "xrat"
version = "0.17.0"
edition = "2024"
description = "A fast, polished CLI and TUI proxy manager for Xray-core and sing-box"
license = "MIT"
repository = "https://github.com/mhyrzt/xrat"
homepage = "https://mhyrzt.github.io/xrat/"
documentation = "https://mhyrzt.github.io/xrat/"
readme = "README.md"
keywords = ["xray", "sing-box", "ratatui", "tunnel", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["testdata/", "docs/", "packaging/desktop/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3.0"
crossterm = "0.29.0"
indicatif = "0.18.4"
flate2 = "1.1.5"
ratatui = "0.30.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
    "socks",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
sha2 = "0.10.9"
prost = "0.13"
tonic = { version = "0.12", default-features = false, features = [
    "transport",
    "codegen",
    "prost",
] }
percent-encoding = "2.3.2"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "postgres",
    "runtime-tokio-rustls",
] }
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
serde_path_to_error = "0.1.20"
sysinfo = "0.37.2"
uuid = { version = "1.23.2", features = ["v4"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tar = "0.4.44"
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
maxminddb = "0.28.1"
qrcode = { version = "0.14.1", default-features = false }
arboard = "3.6.1"
unicode-width = "0.2.2"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
if-addrs = "0.15.0"
