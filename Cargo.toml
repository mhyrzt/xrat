[package]
name = "xrat"
version.workspace = true
edition.workspace = true
description = "A fast, polished CLI and TUI proxy manager for Xray-core and sing-box"
license.workspace = true
repository = "https://github.com/mhyrzt/xrat"
homepage = "https://mhyrzt.github.io/xrat/"
documentation = "https://mhyrzt.github.io/xrat/"
readme = "README.md"
keywords = ["xray", "sing-box", "ratatui", "tunnel", "cli"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["testdata/", "docs/", "packaging/desktop/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
xrat-app.workspace = true
xrat-config.workspace = true
xrat-db.workspace = true
xrat-engines = { workspace = true, features = ["stats"] }
xrat-model.workspace = true
xrat-prober.workspace = true
xrat-support.workspace = true

[dev-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"

[workspace]
members = ["crates/xrat-model", "crates/xrat-support", "crates/xrat-engines", "crates/xrat-config", "crates/xrat-db", "crates/xrat-prober", "crates/xrat-app", "crates/xrat-sdk"]
resolver = "3"

[workspace.package]
version = "0.22.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
xrat-model = { path = "crates/xrat-model", version = "0.22.0" }
xrat-support = { path = "crates/xrat-support", version = "0.22.0" }
xrat-config = { path = "crates/xrat-config", version = "0.22.0" }
xrat-engines = { path = "crates/xrat-engines", version = "0.22.0", default-features = false }
xrat-db = { path = "crates/xrat-db", version = "0.22.0" }
xrat-prober = { path = "crates/xrat-prober", version = "0.22.0" }
xrat-app = { path = "crates/xrat-app", version = "0.22.0" }
xrat-sdk = { path = "crates/xrat-sdk", version = "0.22.0" }
