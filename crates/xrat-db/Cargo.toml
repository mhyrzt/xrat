[package]
name = "xrat-db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Database connection, records, and repositories for xrat"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "postgres",
    "runtime-tokio-rustls",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.23.2", features = ["v4"] }
xrat-config.workspace = true
xrat-model = { workspace = true, features = ["sqlx"] }
xrat-support.workspace = true
