[book]
title = "xrat - Xray-core and sing-box proxy manager"
authors = ["xrat contributors"]
language = "en"
src = "src"
description = "xrat is a Rust CLI and TUI proxy manager for Xray-core and sing-box. Import VLESS, VMess, Trojan, Shadowsocks, and Hysteria2 configs, test latency, rotate proxies, scan edge IPs, and run managed local proxy sessions."

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"
renderer = ["html"]
optional = true

[output.html]
git-repository-url = "https://github.com/mhyrzt/xrat"
edit-url-template = "https://github.com/mhyrzt/xrat/edit/main/docs/src/{path}"
site-url = "https://mhyrzt.github.io/xrat/"
default-theme = "dark"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1
