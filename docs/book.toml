[book]
title = "xrat 🐀"
authors = ["xrat contributors"]
language = "en"
src = "src"
description = "Manage Xray-core and sing-box proxy configs from one CLI. Import subscriptions, test latency, scan IPs, rotate proxies, and run a managed runtime — all from a single Rust binary."

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"
renderer = ["html"]
optional = true

[output.html]
git-repository-url = "https://github.com/mhyrzt/xrat"
edit-url-template = "https://github.com/mhyrzt/xrat/edit/main/docs/src/{path}"
site-url = "https://mhyrzt.github.io/xrat/"
default-theme = "dark"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1
