[paths]
# Deprecated compatibility alias for [database.sqlite].path.
database = "db.sqlite"
# optional
# xray = "/usr/local/bin/xray" 
# v2ray = "/usr/local/bin/v2ray"
# sing_box = "/usr/local/bin/sing-box"

[database]
backend = "sqlite" # sqlite | postgres

[database.sqlite]
path = "db.sqlite"

[database.postgres]
user = { env = "XRAT_POSTGRES_USER" }
password = { env = "XRAT_POSTGRES_PASSWORD" }
host = "localhost"
port = 5432
db_name = "xrat"
max_connections = 10
min_connections = 1
connect_timeout_secs = 10

[server]
enabled = false
host = "127.0.0.1"
port = 8080
# key accepts either a literal string or { env = "XRAT_API_KEY" }.
key = { env = "XRAT_API_KEY" }
pac_enabled = true
pac_allowed_hosts = ["localhost", "127.0.0.1", "::1"]

[runtime]
engine = "xray" # xray | v2ray | sing-box
replace_active_session = true

[runtime.rotation]
enabled = true
interval_secs = 1800
health_trigger_enabled = true
cooldown_secs = 300
test_concurrency = 0
test_stages = ["icmp", "real_delay"]

[runtime.log]
enabled = true
mask = "none"     # maskAddress: "quarter" | "half" | "full" | "none"
dir = "logs"      # relative to config folder or absolute
dns_log = false
level = "warning" # "debug" | "info" | "warning" | "error" 
keep = true

[runtime.socks]
enabled = true
host = "0.0.0.0"
port = 1080
udp = true
# password accepts either a literal string or { env = "XRAT_SOCKS_PASSWORD" }.
auth = { enabled = true, username = "xrat", password = { env = "XRAT_SOCKS_PASSWORD" } }

[runtime.http]
enabled = false
host = "0.0.0.0"
port = 8080

[runtime.shadowsocks]
enabled = false
host = "0.0.0.0"
port = 1081
method = "aes-128-gcm"
# password accepts either a literal string or { env = "XRAT_SHADOWSOCKS_PASSWORD" }.
password = { env = "XRAT_SHADOWSOCKS_PASSWORD" }
network = "tcp,udp"

[runtime.sniffing]
enabled = true
dest_override = ["http", "tls", "quic"]
route_only = true
metadata_only = false
domains_excluded = []
ips_excluded = []

[runtime.mux]
enabled = true
concurrency = 4
xudp_concurrency = 16
xudp_proxy_udp443 = "skip"

[runtime.fragment]
enabled = true
packets_mode = "tlshello" # "tlshello" | "range"
packets = [1, 3]          # used only when packets_mode = "range"
length = [100, 200]
interval = [10, 20]

[runtime.network]
interface = "eth0"
# Xray ignores bind_address (no source-IP sockopt); kept here to document shape.
bind_address = "192.168.1.10"
mark = 255
listen_interface = ""

[routing]
domain_strategy = "IPIfNonMatch" # "AsIs" | "IPIfNonMatch" | "IPOnDemand"

[parser]
# Controls Xray JSON schema validation, not subscription/share-link imports.
parse_mode = "strict" # "strict" | "lenient" | "auto"

# Custom geo assets managed by XRAT. Each profile can point at local files or
# URLs that XRAT may fetch later. If save_dir is omitted, XRAT stores fetched
# files under CONFIG_PATH/geo/PROFILE_NAME/{geosite.dat,geoip.dat}.
[geo]
auto_update = false
update_interval_hours = 168
# save_dir = "geo/"

[mmdb]
# Dedicated MaxMind MMDB asset directory, separate from [geo] routing assets.
dir = "mmdb"
download_url = "https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/{edition}.mmdb"
timeout_secs = 60
default_editions = ["country", "city", "asn"]
auto_update = false
update_interval_hours = 168

[[geo.profiles]]
name = "default"
geosite = "https://example.com/geosite.dat"
geoip = "https://example.com/geoip.dat"

[[geo.profiles]]
name = "local"
geosite = "geo/local/geosite.dat"
geoip = "geo/local/geoip.dat"

# Client-side route lists managed by XRAT.
# Keep exact domains/IPs separate from geo aliases so XRAT can validate and
# expand/translate them later without mixing syntaxes in one list.
[routing.direct]
domain = []
ip = []
geosite = []
geoip = []

[routing.block]
domain = []
ip = []
geosite = []
geoip = []

[dns]
# Xray DNS queryStrategy. Supported values: "UseIP", "UseIPv4", "UseIPv6", "UseSystem", "default"
query_strategy = "UseSystem"
# DNS servers used in generated Xray runtime config.
servers = [
    "8.8.8.8",
    "https://1.1.1.1/dns-query",
    "https+local://dns.google/dns-query",
    "quic+local://127.0.0.1:5053",        # e.g. adguard home with quic enabled
    "http+local://127.0.0.1:53",          # e.g. dnscrypt-proxy
]
use_system_hosts = true
disable_cache = false
disable_fallback = false
enable_parallel_query = true

[dns.hosts]
"domain:example.test" = "127.0.0.1"
"domain:lan.test" = ["192.168.1.10", "192.168.1.11"]


[testing]
concurrency = 0 # 0 = auto; positive values set exact bulk test concurrency
# Ordered user-facing stages. TCP is an internal gate before real_delay when enabled.
order = ["icmp", "real_delay", "download"]
# "continue" | "skip_remaining" | "mark_failed"
failure_policy = "continue"

[testing.real_delay]
enabled = true
url = "https://www.google.com/generate_204"
timeout = 10_000 # ms

[testing.icmp]
enabled = true
timeout = 3000
attempts = 3

[testing.download]
enabled = false
url = "https://cachefly.cachefly.net/50mb.test"
timeout = 30_000 # ms

[testing.tcp]
enabled = true
timeout = 5000 # ms
